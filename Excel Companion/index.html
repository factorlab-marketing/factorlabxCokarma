<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Companion - Presentation Deck</title>
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Digital Dashboard App Header -->
    <header class="app-header">
        <div class="logo-container">
            <div class="logo-icon">SB</div>
            <div class="logo-text">EXCEL <span>COMPANION</span></div>
        </div>
        <div class="header-controls">
            <div style="font-family: var(--font-heading); font-weight: 800; font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 15px;">
                A4 Landscape Presentation
            </div>
            <button class="btn btn-primary" id="print-btn">
                <i class="fas fa-print"></i> Save / Print PDF
            </button>
        </div>
    </header>

    <!-- Digital Workspace -->
    <div class="viewer-workspace">
        <div id="loader" style="color: white; font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; position: absolute; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 20;">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent-red);"></i>
            <span>Loading Presentation Slides...</span>
        </div>
        
        <div class="book-viewport" style="opacity: 0; transition: opacity 0.4s ease;">
            <div class="book-container">
                <!-- Slides will be dynamically injected here -->
            </div>
        </div>

        <!-- Flip Controls -->
        <div class="bottom-controls">
            <button class="nav-arrow" id="prev-btn" title="Previous Slide (Left Arrow)">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="page-indicator" id="page-indicator">Loading...</div>
            <button class="nav-arrow" id="next-btn" title="Next Slide (Right Arrow)">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
