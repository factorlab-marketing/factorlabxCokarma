<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>The Difference Is Not Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0B1F3B;
            color: white;
        }

        .centered-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        .big-statement {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 56px;
            line-height: 1.2;
            margin-bottom: 40px;
        }

        .highlight {
            color: #C9A227;
        }

        .fact-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 30px 60px;
            font-size: 24px;
            font-weight: 300;
            line-height: 2;
            color: #cbd5e1;
        }

        .check-item i {
            color: #10B981;
            margin-right: 15px;
        }
    </style>
</head>

<body>
    <div class="centered-content px-20">
        <h1 class="big-statement">
            THE DIFFERENCE IS NOT INTELLIGENCE.<br>
            <span class="highlight">IT IS SKILL.</span>
        </h1>

        <div class="fact-box">
            <div><i class="fas fa-check"></i> No background advantage.</div>
            <div><i class="fas fa-check"></i> No special degree required.</div>
            <div class="font-bold text-white mt-4" style="font-size: 28px;">Only structured learning.</div>
        </div>
    </div>
    <script src="../../js/capture_helper.js"></script>
</body>

</html>
