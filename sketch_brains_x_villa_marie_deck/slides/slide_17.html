<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>Accelerating Vision</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .slide-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #0B1F3B 0%, #061121 100%);
            position: relative;
            color: white;
            text-align: center;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(60px);
        }

        .bg-c-1 {
            width: 600px;
            height: 600px;
            background: #C9A227;
            top: -200px;
            right: -200px;
        }

        .content-box {
            z-index: 10;
            max-width: 900px;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 48px;
            line-height: 1.3;
            color: white;
            margin-bottom: 24px;
        }

        .highlight {
            color: #C9A227;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 24px;
            color: #94a3b8;
            margin-bottom: 60px;
        }

        .contact-info {
            display: flex;
            gap: 40px;
            justify-content: center;
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .contact-label {
            color: #C9A227;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .contact-val {
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="slide-container">
        <div class="bg-circle bg-c-1"></div>

        <div class="content-box">
            <h1 class="main-title">
                Let's Accelerate<br>
                <span class="highlight">Villa Marie's Vision</span> Together.
            </h1>
            <p class="subtitle">
                Bridging the gap between potential and performance.
            </p>

            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-label">Partner</div>
                    <div class="contact-val">Sketch Brains</div>
                </div>
                <div class="contact-item">
                    <div class="contact-label">Contact</div>
                    <div class="contact-val">partnerships@sketchbrains.com</div>
                </div>
            </div>

            <div class="mt-16 opacity-50 text-sm">
                www.sketchbrains.com
            </div>
        </div>
    </div>
    <script src="../../js/capture_helper.js"></script>
</body>

</html>
