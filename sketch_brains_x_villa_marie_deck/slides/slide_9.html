<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>The 9-Month Transformation Roadmap</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #EEF2FF;
        }

        .slide-layout {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 80px;
            background: #0B1F3B;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .sidebar-icon {
            color: rgba(255, 255, 255, 0.4);
            font-size: 24px;
            margin-bottom: 40px;
        }

        .sidebar-icon.active {
            color: #8b5cf6;
        }

        .main-content {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50px;
            right: 50px;
            height: 4px;
            background: #cbd5e1;
            z-index: 0;
        }

        .step {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 220px;
        }

        .dot {
            width: 40px;
            height: 40px;
            background: #8b5cf6;
            border-radius: 50%;
            border: 4px solid white;
            margin: 0 auto 20px;
        }

        .months {
            font-weight: 700;
            color: #8b5cf6;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .topic {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            font-weight: 600;
            color: #1e293b;
        }

        .footer-note {
            margin-top: auto;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #0B1F3B;
        }
    </style>
</head>

<body>
    <div class="slide-layout">
        <div class="main-content">
            <h1 class="font-montserrat font-bold text-3xl text-[#0B1F3B]">THE 9-MONTH TRANSFORMATION ROADMAP</h1>

            <div class="timeline">
                <div class="step">
                    <div class="dot"></div>
                    <div class="months">Month 1–2</div>
                    <div class="topic">Excel Mastery</div>
                </div>
                <div class="step">
                    <div class="dot"></div>
                    <div class="months">Month 3–4</div>
                    <div class="topic">SQL Basics</div>
                </div>
                <div class="step">
                    <div class="dot"></div>
                    <div class="months">Month 5–6</div>
                    <div class="topic">Power BI Dashboards</div>
                </div>
                <div class="step">
                    <div class="dot"></div>
                    <div class="months">Month 7–9</div>
                    <div class="topic">Projects + Resume + Internship</div>
                </div>
            </div>

            <div class="footer-note">
                You have 3 years.<br>
                <span class="text-indigo-600">You need 9 months.</span>
            </div>
        </div>
    </div>
    <script src="../../js/capture_helper.js"></script>
</body>

</html>
