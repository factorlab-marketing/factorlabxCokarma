<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>What Happens If You Start In 2nd Year?</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }

        .slide-layout {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 80px;
            background: #0B1F3B;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .sidebar-icon {
            color: rgba(255, 255, 255, 0.4);
            font-size: 24px;
            margin-bottom: 40px;
        }

        .sidebar-icon.active {
            color: #f59e0b;
        }

        .main-content {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
        }

        .staircase {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 400px;
            gap: 20px;
            margin-top: 20px;
        }

        .stair {
            width: 200px;
            color: white;
            border-radius: 8px 8px 0 0;
            padding: 20px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .s1 {
            height: 30%;
            background: #94a3b8;
        }

        .s2 {
            height: 50%;
            background: #64748b;
        }

        .s3 {
            height: 70%;
            background: #334155;
        }

        .s4 {
            height: 90%;
            background: #0B1F3B;
            border-bottom: none;
        }

        .stair-label {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 5px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .stair-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.2;
        }

        .result {
            text-align: center;
            margin-top: 30px;
            font-size: 24px;
            font-weight: 800;
            color: #f59e0b;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="slide-layout">
        <div class="main-content">
            <h1 class="font-montserrat font-bold text-3xl text-[#0B1F3B]">WHAT HAPPENS IF YOU START IN 2ND YEAR?</h1>

            <div class="staircase">
                <div class="stair s1">
                    <div class="stair-label">Year 2</div>
                    <div class="stair-text">Learning</div>
                </div>
                <div class="stair s2">
                    <div class="stair-label">Year 3</div>
                    <div class="stair-text">Internship</div>
                </div>
                <div class="stair s3">
                    <div class="stair-label">Final Year</div>
                    <div class="stair-text">Confident Interviews</div>
                </div>
                <div class="stair s4">
                    <div class="stair-label">Graduation</div>
                    <div class="stair-text text-[#C9A227]">Skilled Professional</div>
                </div>
            </div>

            <div class="result">
                Not just a fresher.
            </div>
        </div>
    </div>
    <script src="../../js/capture_helper.js"></script>
</body>

</html>
