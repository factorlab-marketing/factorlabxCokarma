<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>Why Commerce Students Have An Advantage</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }

        .slide-layout {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 80px;
            background: #0B1F3B;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .sidebar-icon {
            color: rgba(255, 255, 255, 0.4);
            font-size: 24px;
            margin-bottom: 40px;
        }

        .sidebar-icon.active {
            color: #C9A227;
        }

        .main-content {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
        }

        .advantage-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        .adv-item {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 30px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .mini-icon {
            width: 50px;
            height: 50px;
            background: #fffbeb;
            color: #C9A227;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .adv-text {
            font-size: 20px;
            font-weight: 600;
            color: #334155;
        }

        .final-punch {
            margin-top: 50px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #0B1F3B;
        }
    </style>
</head>

<body>
    <div class="slide-layout">
        <div class="main-content">
            <div class="mb-4">
                <h1 class="font-montserrat font-bold text-3xl text-[#0B1F3B]">WHY COMMERCE STUDENTS HAVE AN ADVANTAGE
                </h1>
            </div>

            <div class="advantage-list">
                <div class="adv-item">
                    <div class="mini-icon"><i class="fas fa-check"></i></div>
                    <div class="adv-text">Comfortable with numbers</div>
                </div>
                <div class="adv-item">
                    <div class="mini-icon"><i class="fas fa-check"></i></div>
                    <div class="adv-text">Understand business logic</div>
                </div>
                <div class="adv-item">
                    <div class="mini-icon"><i class="fas fa-check"></i></div>
                    <div class="adv-text">Strong attention to detail</div>
                </div>
                <div class="adv-item">
                    <div class="mini-icon"><i class="fas fa-check"></i></div>
                    <div class="adv-text">Analytical mindset</div>
                </div>
            </div>

            <div class="final-punch">
                You already have the foundation.
            </div>
        </div>
    </div>
    <script src="../../js/capture_helper.js"></script>
</body>

</html>
