<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>Consistency > Talent</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0B1F3B;
            color: white;
        }

        .slide-layout {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 80px;
            background: rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .sidebar-icon {
            color: rgba(255, 255, 255, 0.4);
            font-size: 24px;
            margin-bottom: 40px;
        }

        .sidebar-icon.active {
            color: #10B981;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .formula {
            font-size: 32px;
            margin-bottom: 40px;
            font-weight: 300;
            color: #cbd5e1;
        }

        .formula span {
            font-weight: 700;
            color: #fff;
            display: block;
            font-size: 48px;
            margin: 10px 0;
        }

        .result {
            font-size: 56px;
            font-weight: 800;
            color: #C9A227;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div class="slide-layout">
        <div class="main-content">
            <h1 class="font-montserrat font-bold text-4xl mb-12">CONSISTENCY > TALENT</h1>

            <div class="text-center">
                <div class="formula">
                    <span>1 hour daily</span>
                    ×<br>
                    <span>5 days a week</span>
                    ×<br>
                    <span>6–9 months</span>
                </div>

                <div class="result">
                    = Career Leverage
                </div>
            </div>
        </div>
    </div>
    <script src="../../js/capture_helper.js"></script>
</body>

</html>
