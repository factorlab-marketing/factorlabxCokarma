<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>What Happens If You Don’t Upskill?</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #000;
            color: white;
        }

        .slide-layout {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 80px;
            background: #111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .sidebar-icon {
            color: rgba(255, 255, 255, 0.4);
            font-size: 24px;
            margin-bottom: 40px;
        }

        .sidebar-icon.active {
            color: #ef4444;
        }

        .main-content {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .grid-warning {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 40px;
        }

        .warning-box {
            background: #1e1e1e;
            padding: 30px;
            border-left: 5px solid #ef4444;
            border-radius: 8px;
            font-size: 24px;
            color: #cbd5e1;
        }

        .title-red {
            color: #ef4444;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 40px;
        }
    </style>
</head>

<body>
    <div class="slide-layout">
        <div class="main-content">
            <h1 class="title-red">WHAT HAPPENS IF YOU DON’T UPSKILL?</h1>

            <div class="grid-warning">
                <div class="warning-box"><i class="fas fa-exclamation-triangle mr-3 text-red-500"></i> Final year panic
                </div>
                <div class="warning-box"><i class="fas fa-arrow-down mr-3 text-red-500"></i> Low salary negotiation
                </div>
                <div class="warning-box"><i class="fas fa-users-slash mr-3 text-red-500"></i> Competing unprepared</div>
                <div class="warning-box"><i class="fas fa-ban mr-3 text-red-500"></i> Settling for less</div>
            </div>
        </div>
    </div>
    <script src="../../js/capture_helper.js"></script>
</body>

</html>
