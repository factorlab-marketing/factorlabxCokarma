<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>Level Up</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0B1F3B;
            color: white;
        }

        .centered-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            background: radial-gradient(circle at center, #1a3c6b 0%, #0B1F3B 80%);
            padding: 0 100px;
        }

        .main-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 48px;
            line-height: 1.3;
            margin-bottom: 40px;
        }

        .sub-text {
            font-size: 24px;
            font-weight: 300;
            color: #cbd5e1;
            margin-bottom: 60px;
        }

        .brand {
            font-size: 32px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 18px;
            color: #C9A227;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="centered-box">
        <h1 class="main-text">
            LEVEL UP BEFORE THE MARKET<br>
            DECIDES FOR YOU.
        </h1>

        <p class="sub-text">
            If you hear about structured Data Analytics training…<br>
            Explore it seriously.
        </p>

        <div class="mt-12">
            <div class="brand">Sketch Brains</div>
            <div class="tagline">Where Learning Has No Boundaries</div>
        </div>
    </div>
    <script src="../../js/capture_helper.js"></script>
</body>

</html>
