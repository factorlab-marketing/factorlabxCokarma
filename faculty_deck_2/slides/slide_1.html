<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 1 - Cover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
    </style>
</head>

<body
    class="bg-slate-50 text-slate-900 w-[1280px] h-[720px] overflow-hidden relative flex flex-col items-center justify-center">

    <!-- Background Elements -->
    <div
        class="absolute top-0 right-0 w-[800px] h-[800px] bg-gradient-to-b from-teal-50 to-emerald-50 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 z-0">
    </div>
    <div
        class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-indigo-50 rounded-full blur-3xl translate-y-1/2 -translate-x-1/3 z-0">
    </div>

    <!-- Main Container -->
    <div class="z-10 text-center w-full max-w-4xl px-8">

        <!-- Logos -->
        <div class="flex items-center justify-center mb-16">
            <!-- Using relative paths to the sibling directory's assets -->
            <img src="../../assets/factorlab_black_logo.png" alt="factorlab logo"
                class="h-24 object-contain opacity-90">
        </div>

        <!-- Title Section -->
        <div class="mb-12">
            <p class="text-emerald-600 font-bold tracking-[0.2em] uppercase text-sm mb-4">Exclusive Investment Session
            </p>
            <h1 class="text-7xl font-extrabold text-slate-900 mb-6 leading-tight">
                Faculty <span class="text-emerald-600">x</span> factorlab
            </h1>
            <p class="text-2xl text-slate-500 font-light max-w-2xl mx-auto leading-relaxed">
                Smart Wealth Creation Strategies for Academic Professionals
            </p>
        </div>

        <!-- CTA / Decorative Line -->
        <div class="flex flex-col items-center">
            <div class="w-24 h-1 bg-gradient-to-r from-teal-500 to-emerald-500 rounded-full mb-8"></div>

            <div class="glass-card px-8 py-4 rounded-full flex items-center space-x-4">
                <div class="flex -space-x-2">
                    <div
                        class="w-8 h-8 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-xs">
                        <i class="fas fa-chart-pie text-slate-500"></i>
                    </div>
                    <div
                        class="w-8 h-8 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-xs">
                        <i class="fas fa-coins text-slate-500"></i>
                    </div>
                    <div
                        class="w-8 h-8 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-xs">
                        <i class="fas fa-chart-line text-slate-500"></i>
                    </div>
                </div>
                <span class="text-sm font-semibold text-slate-600">Mutual Funds • Stocks • Financial Freedom</span>
            </div>
        </div>

    </div>

    <!-- Footer Decoration -->
    <div class="absolute bottom-6 w-full text-center">
        <p class="text-xs text-slate-400 uppercase tracking-widest">Presented by Team factorlab</p>
    </div>

    <!-- Theme Listener -->
    <script>
        window.addEventListener('message', (event) => {
            if (event.data.type === 'theme-update') {
                const { isDark, css } = event.data;
                let styleTag = document.getElementById('theme-style');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'theme-style';
                    document.head.appendChild(styleTag);
                }
                styleTag.innerHTML = isDark ? css : '';

                // Logo Logic: Black for Light, Normal (Teal) for Dark
                const logo = document.querySelector('img[alt="factorlab logo"]');
                if (logo) {
                    logo.src = isDark ? "../../assets/factorlab logo.png" : "../../assets/factorlab_black_logo.png";
                }
            }
        });
    </script>
</body>

</html>
