<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 1 - Retirement Opener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
<script src='../../js/capture_helper.js'></script>
</head>

<body
    class="bg-slate-50 text-slate-900 w-[1280px] h-[720px] overflow-hidden relative flex flex-col justify-center items-center p-0">

    <!-- Background Elements -->
    <div
        class="absolute top-0 right-0 w-[600px] h-[600px] bg-yellow-100 rounded-full blur-3xl translate-x-1/2 -translate-y-1/2 opacity-70">
    </div>
    <div
        class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-blue-100 rounded-full blur-3xl -translate-x-1/2 translate-y-1/2 opacity-70">
    </div>

    <!-- Content -->
    <div class="z-10 text-center max-w-5xl mx-auto">

        <!-- Main Headline -->
        <h1 class="text-7xl font-extrabold text-slate-800 mb-6 tracking-tight">
            Retire <span class="text-emerald-600">Like a Boss</span>...<br>
            <span class="text-4xl font-semibold text-slate-500 mt-2 block">or Broke?</span>
        </h1>

        <!-- Fun Visual Representation -->
        <div class="flex justify-center items-end space-x-12 mb-12 mt-10">
            <!-- Chill Boss -->
            <div class="flex flex-col items-center group cursor-pointer">
                <div class="relative">
                    <div
                        class="w-48 h-48 bg-white border-4 border-emerald-400 rounded-full flex items-center justify-center shadow-xl group-hover:scale-105 transition-transform duration-300">
                        <!-- Using an icon stack to simulate a relaxed person -->
                        <div class="text-center">
                            <i class="fas fa-umbrella-beach text-6xl text-emerald-500 mb-2"></i>
                            <div class="text-emerald-500 text-3xl"><i class="fas fa-cocktail"></i></div>
                        </div>
                    </div>
                    <div
                        class="absolute -top-4 -right-4 bg-emerald-500 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold border-4 border-white">
                        <i class="fas fa-check"></i>
                    </div>
                </div>
                <p class="mt-4 text-2xl font-bold text-slate-700">The Boss Life</p>
                <p class="text-slate-500">Travel, Relax, Freedom</p>
            </div>

            <!-- VS Badge -->
            <div class="pb-16 text-3xl font-black text-slate-300 italic">VS</div>

            <!-- Broke -->
            <div class="flex flex-col items-center group cursor-pointer">
                <div class="relative">
                    <div
                        class="w-48 h-48 bg-white border-4 border-slate-200 rounded-full flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-300 grayscale hover:grayscale-0">
                        <div class="text-center text-slate-400">
                            <i class="fas fa-piggy-bank text-6xl mb-2 opacity-50"></i>
                            <div class="text-xl font-mono">‚¹0.00</div>
                        </div>
                    </div>
                    <div
                        class="absolute -top-4 -right-4 bg-slate-400 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold border-4 border-white">
                        <i class="fas fa-question"></i>
                    </div>
                </div>
                <p class="mt-4 text-2xl font-bold text-slate-400">The Struggle</p>
                <p class="text-slate-400">Stress, Work, Worry</p>
            </div>
        </div>

        <!-- Question -->
        <div class="bg-white px-10 py-5 rounded-full shadow-lg border border-slate-200 inline-block">
            <h2 class="text-3xl font-bold text-slate-800">
                Ready for your <span class="text-blue-600">dream retirement?</span>
            </h2>
        </div>

    </div>

    <!-- Theme Listener -->
    <script>
        window.addEventListener('message', (event) => {
            if (event.data.type === 'theme-update') {
                const { isDark, css } = event.data;
                let styleTag = document.getElementById('theme-style');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'theme-style';
                    document.head.appendChild(styleTag);
                }
                styleTag.innerHTML = isDark ? css : '';
            }
        });
    </script>
</body>

</html>
