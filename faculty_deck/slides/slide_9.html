<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 9 - Compounding Magic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Montserrat', sans-serif;
        }

        .formula-t {
            position: relative;
            display: inline-block;
        }

        .formula-t::after {
            content: '';
            position: absolute;
            top: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            background: #eab308;
            border-radius: 50%;
            z-index: -1;
            filter: blur(10px);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }

            100% {
                opacity: 0.5;
                transform: scale(1);
            }
        }
    </style>
    <script src='../../js/capture_helper.js'></script>
</head>

<body
    class="bg-slate-50 text-slate-900 w-[1280px] h-[720px] overflow-hidden relative flex flex-col justify-center items-center p-0">

    <!-- Background Elements -->
    <div class="absolute inset-0 bg-gradient-to-tr from-slate-50 via-white to-emerald-50 opacity-80"></div>

    <!-- Main Content -->
    <div class="z-10 text-center max-w-6xl mx-auto">

        <!-- Headline -->
        <h1 class="text-6xl font-extrabold text-slate-800 mb-16 tracking-tight">
            The <span class="text-emerald-600">8th Wonder</span> of the World
        </h1>

        <!-- Formula Visual -->
        <div class="flex items-center justify-center space-x-8 mb-20 scale-125 transform">
            <span class="text-7xl font-bold text-slate-400">A =</span>

            <div class="relative group cursor-help">
                <span class="text-7xl font-bold text-blue-500">P</span>
                <div
                    class="absolute top-full mt-4 left-1/2 -translate-x-1/2 bg-blue-50 text-blue-700 px-3 py-1 rounded-lg text-sm font-bold opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                    Principal (Your Money)
                </div>
            </div>

            <span class="text-7xl font-bold text-slate-300 mx-2">×</span>

            <div class="text-7xl font-bold text-slate-600">
                (1 +
                <div class="relative inline-block group cursor-help">
                    <span class="text-emerald-500">r</span>
                    <div
                        class="absolute top-full mt-4 left-1/2 -translate-x-1/2 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-lg text-sm font-bold opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                        Rate of Return
                    </div>
                </div>
                )
            </div>

            <div class="self-start -mt-8 ml-2">
                <div class="relative group cursor-help formula-t">
                    <span class="text-8xl font-black text-amber-500">t</span>
                    <div
                        class="absolute left-full top-1/2 -translate-y-1/2 ml-4 bg-amber-100 text-amber-700 px-4 py-2 rounded-lg text-lg font-bold shadow-lg animate-bounce whitespace-nowrap">
                        <i class="fas fa-clock mr-2"></i> TIME
                    </div>
                </div>
            </div>
        </div>

        <!-- Hierarchy Visual -->
        <div class="grid grid-cols-3 gap-8 text-center max-w-4xl mx-auto">

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 opacity-60">
                <div class="text-2xl font-bold text-blue-500 mb-2">Principal (P)</div>
                <p class="text-slate-500 text-sm">How much you save.</p>
                <div class="mt-2 text-slate-300 font-bold">Important</div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 opacity-80">
                <div class="text-2xl font-bold text-emerald-500 mb-2">Return (r)</div>
                <p class="text-slate-500 text-sm">How well you invest.</p>
                <div class="mt-2 text-slate-400 font-bold">Very Important</div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-amber-400 transform scale-110">
                <div class="text-3xl font-black text-amber-500 mb-2">TIME (t)</div>
                <p class="text-slate-600 font-bold text-sm">How long you wait.</p>
                <div class="mt-2 text-amber-600 font-bold uppercase tracking-widest text-sm">
                    <i class="fas fa-crown text-amber-400 mr-1"></i> The King
                </div>
            </div>

        </div>

    </div>

    <!-- Theme Listener -->
    <script>
        window.addEventListener('message', (event) => {
            if (event.data.type === 'theme-update') {
                const { isDark, css } = event.data;
                let styleTag = document.getElementById('theme-style');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'theme-style';
                    document.head.appendChild(styleTag);
                }
                styleTag.innerHTML = isDark ? css : '';
            }
        });
    </script>
</body>

</html>
