<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 7 - Risk Myth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
<script src='../../js/capture_helper.js'></script>
</head>

<body
    class="bg-slate-50 text-slate-900 w-[1280px] h-[720px] overflow-hidden relative flex flex-col justify-center p-14">

    <!-- Background Elements -->
    <div
        class="absolute top-0 left-0 w-[600px] h-[600px] bg-slate-100 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 opacity-70">
    </div>

    <!-- Main Heading -->
    <div class="text-center w-full mb-10">
        <h1 class="text-5xl font-extrabold text-slate-800 leading-tight mb-2">
            Time is the Antidote to <span class="text-red-600">Risk</span>
        </h1>
        <p class="text-xl text-slate-500">The longer you stay, the smoother the ride.</p>
    </div>

    <!-- 3 Charts Container -->
    <div class="w-full flex space-x-6 justify-center items-stretch h-80">

        <!-- 1 Year -->
        <div
            class="flex-1 bg-white rounded-2xl shadow-lg border-t-4 border-red-500 p-4 flex flex-col items-center relative overflow-hidden group">
            <h3 class="font-bold text-slate-700 mb-1">1 Year</h3>
            <p class="text-[10px] uppercase font-bold text-slate-400 mb-2">short term</p>

            <div class="flex-1 w-full relative">
                <canvas id="chart1yr"></canvas>
            </div>

            <div class="w-full flex justify-center items-center mt-3 pt-3 border-t border-slate-100">
                <div
                    class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                    <i class="fas fa-bolt mr-1"></i> Scary
                </div>
            </div>
        </div>

        <!-- 5 Years -->
        <div
            class="flex-1 bg-white rounded-2xl shadow-lg border-t-4 border-amber-500 p-4 flex flex-col items-center opacity-90 relative overflow-hidden group">
            <h3 class="font-bold text-slate-700 mb-1">5 Years</h3>
            <p class="text-[10px] uppercase font-bold text-slate-400 mb-2">medium term</p>

            <div class="flex-1 w-full relative">
                <canvas id="chart5yr"></canvas>
            </div>

            <div class="w-full flex justify-center items-center mt-3 pt-3 border-t border-slate-100">
                <div
                    class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                    <i class="fas fa-wave-square mr-1"></i> Bumpy
                </div>
            </div>
        </div>

        <!-- 10 Years -->
        <div
            class="flex-1 bg-white rounded-2xl shadow-xl border-t-4 border-emerald-500 p-4 flex flex-col items-center transform scale-110 z-10 relative overflow-hidden group ring-4 ring-emerald-50 ring-opacity-50">
            <h3 class="font-bold text-slate-700 mb-1">10+ Years</h3>
            <p class="text-[10px] uppercase font-bold text-slate-400 mb-2">long term</p>

            <div class="flex-1 w-full relative">
                <canvas id="chart10yr"></canvas>
            </div>

            <div class="w-full flex justify-center items-center mt-3 pt-3 border-t border-slate-100">
                <div
                    class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                    <i class="fas fa-rocket mr-1"></i> Wealth
                </div>
            </div>
            <!-- Winner Badge -->
            <div class="absolute top-0 right-0 bg-emerald-500 text-white text-[10px] font-bold px-2 py-1 rounded-bl-lg">
                WINNER
            </div>
        </div>

    </div>

    <!-- Three Charts Logic -->
    <script>
        const downColor = '#ef4444'; // Red
        const upColor = '#10b981';   // Green

        // Common segment logic for Up/Down coloring
        const segmentLogic = {
            borderColor: ctx => ctx.p0.parsed.y > ctx.p1.parsed.y ? downColor : upColor,
        };

        // Chart 1: 1 Year Volatility (Zig Zag)
        const ctx1 = document.getElementById('chart1yr').getContext('2d');

        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: Array.from({ length: 12 }, (_, i) => `M${i + 1}`),
                datasets: [{
                    data: [100, 90, 110, 85, 95, 120, 105, 80, 95, 115, 90, 105],
                    borderWidth: 2,
                    tension: 0,
                    pointRadius: 0,
                    fill: false,
                    segment: segmentLogic
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false, min: 70 } }
            }
        });

        // Chart 2: 5 Years (Moderate)
        const ctx2 = document.getElementById('chart5yr').getContext('2d');

        new Chart(ctx2, {
            type: 'line',
            data: {
                labels: Array.from({ length: 50 }, (_, i) => i),
                datasets: [{
                    // Random-looking volatility that trends up
                    data: Array.from({ length: 50 }, (_, i) => 100 + (i * 1.5) + ((Math.random() - 0.5) * 40)),
                    borderWidth: 2,
                    tension: 0.1, // Less smooth, more jagged
                    pointRadius: 0,
                    fill: false,
                    segment: segmentLogic
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Chart 3: 10 Years (Smooth Growth)
        const ctx3 = document.getElementById('chart10yr').getContext('2d');

        new Chart(ctx3, {
            type: 'line',
            data: {
                labels: Array.from({ length: 100 }, (_, i) => i),
                datasets: [{
                    // Steeper incline with some ups and downs (Market Reality)
                    data: Array.from({ length: 100 }, (_, i) => 100 + (i * 3) + ((Math.random() - 0.4) * 30)),
                    borderWidth: 2,
                    tension: 0.2,
                    pointRadius: 0,
                    fill: false,
                    segment: segmentLogic
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });
    </script>

    <!-- Theme Listener -->
    <script>
        window.addEventListener('message', (event) => {
            if (event.data.type === 'theme-update') {
                const { isDark, css } = event.data;
                let styleTag = document.getElementById('theme-style');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'theme-style';
                    document.head.appendChild(styleTag);
                }
                styleTag.innerHTML = isDark ? css : '';
            }
        });
    </script>
</body>

</html>
