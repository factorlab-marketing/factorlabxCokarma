<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 10</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #09090B;
            --accent: #DC2626;
            --text-dark: #1E293B;
            --text-muted: #71717A;
            --bg-canvas: #FAFAFA;
            --bg-slide: #FFFFFF;
            --border-light: #E4E4E7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-canvas);
            width: 1280px;
            height: 720px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-slide);
            padding: 60px 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .grid-dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(220, 38, 38, 0.05) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        .orb-glow-1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .slide-content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .cta-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(220, 38, 38, 0.06);
            border: 1px solid rgba(220, 38, 38, 0.12);
            padding: 8px 16px;
            border-radius: 30px;
            width: fit-content;
            margin-bottom: 28px;
        }

        .cta-kicker span {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .cta-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 42px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.3;
            letter-spacing: -1.5px;
            max-width: 800px;
            margin-bottom: 40px;
        }

        /* Interactive Email Button */
        .email-btn {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
            border: none;
            border-radius: 50px;
            padding: 20px 48px;
            color: #FFFFFF;
            text-decoration: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 750;
            box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.35), 0 0 1px 1.5px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .email-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(220, 38, 38, 0.45), 0 0 1px 2px rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        }

        .email-btn i {
            font-size: 24px;
        }

        .cta-hint {
            margin-top: 24px;
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Custom Brand Logo */
        .sb-logo {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            font-size: 20px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -0.05em;
            color: #000000;
            text-decoration: none;
            transition: opacity 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .sb-logo:hover {
            opacity: 0.7;
        }

        .sb-dot {
            color: var(--accent);
        }

        /* Footer */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            padding-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-dots"></div>
        <div class="orb-glow-1"></div>

        <div class="slide-content">
            <div class="cta-kicker">
                <i class="fa-solid fa-handshake" style="color: var(--accent);"></i>
                <span>Join As Partner</span>
            </div>

            <h1 class="cta-title">
                Want to be a hiring partner for this flagship hackathon?
            </h1>

            <a href="mailto:partnerships@sketchbrains.live" class="email-btn">
                <i class="fa-solid fa-envelope"></i>
                <span>partnerships@sketchbrains.live</span>
            </a>

            <p class="cta-hint">
                Reach out to secure your hiring slot. Space is limited.
            </p>
        </div>

        <div class="footer">
            <a href="https://sketchbrains.live" class="sb-logo" target="_blank">
                SketchBrains<span class="sb-dot">.</span>
            </a>
            <span>The Verdict 1.0 • October 10th</span>
            <span>10 / 10</span>
        </div>
    </div>
    
    <script src="../../js/capture_helper.js"></script>
</body>
</html>
