<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 3</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #09090B;
            --accent: #DC2626;
            --text-muted: #71717A;
            --bg-canvas: #FAFAFA;
            --bg-slide: #FFFFFF;
            --border-light: #E4E4E7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-canvas);
            width: 1280px;
            height: 720px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-slide);
            padding: 60px 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            align-items: center;
        }

        .grid-dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(220, 38, 38, 0.05) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        .orb-glow-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .concentric-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(220, 38, 38, 0.12);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .slide-content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 900px;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(220, 38, 38, 0.06);
            border: 1px solid rgba(220, 38, 38, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 36px;
            margin-bottom: 32px;
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.05);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.9; }
        }

        .turn-headline {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 64px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
            letter-spacing: -2px;
        }

        .turn-highlight {
            background: linear-gradient(135deg, #09090B 0%, #DC2626 50%, #7F1D1D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Brand Logo */
        .sb-logo {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            font-size: 20px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -0.05em;
            color: #000000;
            text-decoration: none;
            transition: opacity 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .sb-logo:hover {
            opacity: 0.7;
        }

        .sb-dot {
            color: var(--accent);
        }

        /* Footer */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            padding-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-dots"></div>
        <div class="orb-glow-center"></div>
        <div class="concentric-circle" style="width: 500px; height: 500px;"></div>
        <div class="concentric-circle" style="width: 650px; height: 650px;"></div>

        <div class="slide-content">
            <div class="icon-box">
                <i class="fa-solid fa-bolt"></i>
            </div>
            
            <h1 class="turn-headline">
                Why don't <span class="turn-highlight">you</span> do the same?
            </h1>
        </div>

        <div class="footer">
            <a href="https://sketchbrains.live" class="sb-logo" target="_blank">
                SketchBrains<span class="sb-dot">.</span>
            </a>
            <span>The Verdict 1.0 • October 10th</span>
            <span>03 / 10</span>
        </div>
    </div>
    
    <script src="../../js/capture_helper.js"></script>
</body>
</html>
