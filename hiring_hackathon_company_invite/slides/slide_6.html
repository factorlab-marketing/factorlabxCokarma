<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 6</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #09090B;
            --accent: #DC2626;
            --success: #DC2626;
            --text-dark: #18181B;
            --text-muted: #71717A;
            --bg-canvas: #FAFAFA;
            --bg-slide: #FFFFFF;
            --border-light: #E4E4E7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-canvas);
            width: 1280px;
            height: 720px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-slide);
            padding: 60px 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .grid-dots {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(220, 38, 38, 0.05) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        .orb-glow-1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .slide-content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .guarantee-box {
            background: #FFFFFF;
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 48px 60px;
            max-width: 900px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.04), 0 0 1px 1px rgba(220, 38, 38, 0.02);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .guarantee-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -20px rgba(220, 38, 38, 0.08);
            border-color: rgba(220, 38, 38, 0.25);
        }

        /* Glowing Border Overlay */
        .guarantee-box::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            background: linear-gradient(135deg, #DC2626, #09090B);
            z-index: -1;
            opacity: 0.12;
        }

        .guarantee-icon {
            width: 72px;
            height: 72px;
            background: rgba(220, 38, 38, 0.06);
            border: 1px solid rgba(220, 38, 38, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 30px;
            margin-bottom: 28px;
        }

        .guarantee-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 42px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.3;
            letter-spacing: -1.5px;
        }

        .guarantee-highlight {
            background: linear-gradient(135deg, #DC2626 0%, #09090B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Brand Logo */
        .sb-logo {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            font-size: 20px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -0.05em;
            color: #000000;
            text-decoration: none;
            transition: opacity 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .sb-logo:hover {
            opacity: 0.7;
        }

        .sb-dot {
            color: var(--accent);
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            padding-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-dots"></div>
        <div class="orb-glow-1"></div>

        <div class="slide-content">
            <div class="guarantee-box">
                <div class="guarantee-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="guarantee-text">
                    "Once you hire <span class="guarantee-highlight">this way</span>, you won't want to go back to traditional hiring."
                </h2>
            </div>
        </div>

        <div class="footer">
            <a href="https://sketchbrains.live" class="sb-logo" target="_blank">
                SketchBrains<span class="sb-dot">.</span>
            </a>
            <span>The Verdict 1.0 • October 10th</span>
            <span>06 / 10</span>
        </div>
    </div>
    
    <script src="../../js/capture_helper.js"></script>
</body>
</html>
