<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=1280, height=720" name="viewport" />
    <title>Salary Growth Graph 2</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        body, html {
            margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden;
            font-family: 'Inter', sans-serif; background: #0D0D0D; color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; font-weight: 800; }
        
        .accent-red { color: #E53935; }
        .accent-cream { color: #F5F1E8; }
        
        .border-red-accent { border-color: #E53935; }
        .bg-red-accent { background-color: #E53935; }
        
        .huge-number {
            font-size: 14rem;
            line-height: 1;
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
        }
        
        /* Slide margins/layout */
        .slide-container {
            width: 1280px;
            height: 720px;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        
        /* Fade and slide transitions */
        .fade-in {
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Light Mode Native Overrides (Disables cheap parent filters) */
        body.light-mode {
            background: #F5F1E8 !important;
            color: #0D0D0D !important;
        }
        
        body.light-mode .text-white { color: #0D0D0D !important; }
        body.light-mode .text-slate-300, 
        body.light-mode .text-slate-400 { color: #4A4A4A !important; }
        body.light-mode .text-slate-500 { color: #777777 !important; }
        body.light-mode .accent-cream { color: #0D0D0D !important; }
        
        body.light-mode .border-white\/10 { border-color: rgba(13, 13, 13, 0.15) !important; }
        body.light-mode .border-slate-800 { border-color: #D6D2C4 !important; }
        body.light-mode .bg-white\/5 { background-color: rgba(13, 13, 13, 0.04) !important; }
        body.light-mode .bg-white\/10 { background-color: rgba(13, 13, 13, 0.08) !important; }
        body.light-mode .bg-slate-900 { background-color: #E6E1D5 !important; }
        body.light-mode .opacity-40 { opacity: 0.65 !important; }
        body.light-mode .opacity-30 { opacity: 0.45 !important; }
        body.light-mode .opacity-50 { opacity: 0.70 !important; }
        body.light-mode .opacity-60 { opacity: 0.80 !important; }
        
        /* Graph fixes */
        body.light-mode svg text { fill: #0D0D0D !important; }
        body.light-mode svg line { stroke: rgba(13, 13, 13, 0.1) !important; }
        body.light-mode svg path[stroke="#64748b"] { stroke: #475569 !important; }
        
        /* Cancel parent filter inversion */
        html {
            filter: none !important;
        }
    </style>
</head>
<body class="flex items-center justify-center">
    <div class="slide-container">
        <!-- Top Metadata -->
        <div class="flex justify-between items-center text-xs tracking-wider text-[#F5F1E8] opacity-40 accent-cream">
            <div>KEYNOTE PRESENTATION</div>
            <div>SKETCH BRAINS × KPRIT</div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col justify-center my-auto">
            
        <div class="w-full max-w-4xl fade-in">
            <h2 class="text-3xl font-extrabold mb-6">Growth Trajectory</h2>
            <div class="flex items-center justify-between gap-12">
                <!-- SVG Line Graph -->
                <div class="flex-1">
                    <svg viewBox="0 0 500 250" class="w-full h-auto overflow-visible">
                        <!-- Grid Lines -->
                        <line x1="50" y1="20" x2="480" y2="20" stroke="rgba(255,255,255,0.05)" />
                        <line x1="50" y1="90" x2="480" y2="90" stroke="rgba(255,255,255,0.05)" />
                        <line x1="50" y1="160" x2="480" y2="160" stroke="rgba(255,255,255,0.05)" />
                        <line x1="50" y1="230" x2="480" y2="230" stroke="rgba(255,255,255,0.1)" />
                        
                        <!-- Trajectory Line 1 (Linear support) -->
                        <path d="M 50 180 L 120 170 L 190 160 L 260 150 L 330 140 L 400 130 L 480 120" 
                              fill="none" stroke="#64748b" stroke-width="3" />
                        <text x="485" y="125" fill="#64748b" font-size="10" font-weight="bold">Linear support</text>
                        
                        <!-- Trajectory Line 2 (Compounding technical) -->
                        <path d="M 50 140 L 120 125 L 190 105 L 260 85 L 330 65 L 400 45 L 480 25" 
                              fill="none" stroke="#e53935" stroke-width="4" />
                        <text x="485" y="20" fill="#e53935" font-size="10" font-weight="bold">Technical curve</text>
                        
                        <!-- Axis Labels -->
                        <text x="50" y="245" fill="#888" font-size="10">Year 1</text>
                        <text x="450" y="245" fill="#888" font-size="10">Year 8</text>
                    </svg>
                </div>
            </div>
        </div>
    
        </div>

        <!-- Bottom Footer -->
        <div class="flex justify-between items-center text-xs tracking-wider text-[#F5F1E8] opacity-40 accent-cream">
            <div>CLARITY. CAPABILITY. CAREER EXECUTION.</div>
            <div>© 2026 SKETCH BRAINS</div>
        </div>
    </div>
    
    <script src="../../js/capture_helper.js"></script>
    <script src="../../js/theme_helper.js"></script>
</body>
</html>
