<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FactorLab - Pitch Decks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            /* Slate 900 */
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen text-slate-100 relative overflow-hidden">

    <!-- Background Decoration -->
    <div
        class="absolute top-0 left-0 w-[500px] h-[500px] bg-teal-500/20 rounded-full blur-[100px] -translate-x-1/2 -translate-y-1/2">
    </div>
    <div
        class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-emerald-600/10 rounded-full blur-[100px] translate-x-1/3 translate-y-1/3">
    </div>

    <div class="relative z-10 text-center max-w-4xl w-full px-6">

        <img src="assets/factorlab_black_logo.png" alt="FactorLab Logo"
            class="h-16 mx-auto mb-8 object-contain bg-white/10 p-2 rounded-lg backdrop-blur-sm invert">

        <h1 class="text-4xl md:text-5xl font-extrabold font-montserrat mb-4 tracking-tight">
            Presentation Hub
        </h1>
        <p class="text-slate-400 mb-12 text-lg">Select a pitch deck to view.</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Faculty Deck -->
            <a href="faculty_deck/index.html"
                class="group block p-6 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-teal-500 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-teal-900/20">
                <div
                    class="w-16 h-16 bg-teal-900/50 rounded-xl flex items-center justify-center mb-6 text-teal-400 group-hover:scale-110 transition-transform mx-auto">
                    <i class="fas fa-university text-3xl"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2 font-montserrat">Faculty Deck</h3>
                <p class="text-sm text-slate-400 group-hover:text-teal-200/70">Investment comparison and strategies for
                    academic professionals.</p>
            </a>

            <!-- CoKarma Deck -->
            <a href="cokarma_deck/index.html"
                class="group block p-6 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-blue-500 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-blue-900/20">
                <div
                    class="w-16 h-16 bg-blue-900/50 rounded-xl flex items-center justify-center mb-6 text-blue-400 group-hover:scale-110 transition-transform mx-auto">
                    <i class="fas fa-layer-group text-3xl"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2 font-montserrat">CoKarma Deck</h3>
                <p class="text-sm text-slate-400 group-hover:text-blue-200/70">General company introduction and
                    partnership overview.</p>
            </a>

            <!-- HR Deck -->
            <a href="hr_deck/index.html"
                class="group block p-6 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-purple-500 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-purple-900/20">
                <div
                    class="w-16 h-16 bg-purple-900/50 rounded-xl flex items-center justify-center mb-6 text-purple-400 group-hover:scale-110 transition-transform mx-auto">
                    <i class="fas fa-users text-3xl"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2 font-montserrat">HR Deck</h3>
                <p class="text-sm text-slate-400 group-hover:text-purple-200/70">Employee-focused benefits and financial
                    wellness plans.</p>
            </a>

        </div>

    </div>

</body>

</html>
